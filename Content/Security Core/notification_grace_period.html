    <body>
        <h1>Notification Grace Period</h1>
        <MadCap:snippetBlock src="../Resources/Snippets/IlluminateBanner.flsnp" />
        <p>You may wish to limit the number of notifications sent for an alert; in that case, you can set a grace period when attaching a notification to an alert. The grace period determines how often a notification is sent when duplicate alerts are triggered.</p>

            <img src="../Resources/Images/notification_grace_period/notification_grace_period_setting.png" />
